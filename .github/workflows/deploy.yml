name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 用 npm install 而不是 npm ci：
      # npm ci 对 lock 与各平台可选依赖（esbuild / rollup 的平台二进制）要求极其严格，
      # 一旦对不上就整条构建失败。install 容忍度更高，且结果一致。
      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      # 关于站点子路径：
      # 本项目用 HashRouter，页面 URL 永远停在 /仓库名/ 这一层（#/settings 之类不参与路径解析），
      # 所以 Vite 的 base 用默认的 './' 相对路径就必然解析正确 —— 用户主页仓库和普通仓库都适用。
      # 产物因此也能直接双击 dist/index.html 打开，不依赖部署位置。
      - name: 构建
        run: npm run build

      # 关掉 Jekyll：它默认会忽略下划线开头的文件/目录，是 Pages 上常见的隐形坑
      - name: 关闭 Jekyll 处理
        run: touch dist/.nojekyll

      - name: 检查产物（空白页排查用）
        run: |
          echo "--- dist 结构 ---"
          find dist -type f | head -40
          echo "--- index.html 里的资源引用 ---"
          grep -oE '(src|href)="[^"]+"' dist/index.html || true

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
